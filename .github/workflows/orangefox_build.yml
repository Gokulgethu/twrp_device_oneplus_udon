name: Build OrangeFox Recovery for OnePlus 11R (udon)

on:
  workflow_dispatch:
    inputs:
      FOX_BRANCH:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: 'fox_12.1'
        type: choice
        options:
          - 'fox_12.1'
          - 'fox_11.0'
      BUILD_TYPE:
        description: 'Build Target'
        required: true
        default: 'recoveryimage'
        type: choice
        options:
          - 'recoveryimage'
          - 'bootimage'

jobs:
  build:
    name: Build OrangeFox (${{ inputs.FOX_BRANCH }})
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: device/oneplus/udon

      - name: Free Disk Space & Setup Swap
        run: |
          echo "=== Freeing Disk Space ==="
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /usr/share/swift || true
          sudo docker image prune -a --force || true
          
          echo "=== Setting up 16GB Swapfile ==="
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile || true
          sudo fallocate -l 16G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=16384
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 python-is-python3 libssl-dev libtinfo5 rsync bc
          sudo curl --create-dirs -L -o /usr/local/bin/repo -O -L https://storage.googleapis.com/git-repo-downloads/repo
          sudo chmod a+rx /usr/local/bin/repo

      - name: Initialize & Sync OrangeFox Manifest
        run: |
          mkdir -p ~/fox
          cd ~/fox
          git config --global user.name "The LineageOS Project"
          git config --global user.email "dev@lineageos.org"
          repo init -u https://gitlab.com/OrangeFox/Manifest.git -b ${{ inputs.FOX_BRANCH || 'fox_12.1' }} --depth=1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Integrate OnePlus 11R Device Tree
        run: |
          rm -rf ~/fox/device/oneplus/udon
          mkdir -p ~/fox/device/oneplus
          cp -r $GITHUB_WORKSPACE/device/oneplus/udon ~/fox/device/oneplus/

      - name: Build OrangeFox Recovery
        run: |
          cd ~/fox
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1
          export FOX_VIRTUAL_AB_DEVICE=1
          export TARGET_DEVICE=udon
          export LC_ALL="C"
          source build/envsetup.sh
          lunch fox_udon-eng || lunch omni_udon-eng || lunch twrp_udon-eng
          mka ${{ inputs.BUILD_TYPE || 'recoveryimage' }} -j$(nproc --all) || mka recoveryimage -j$(nproc --all) || mka bootimage -j$(nproc --all)

      - name: Upload Recovery Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-OnePlus11R-${{ github.sha }}
          path: |
            ~/fox/out/target/product/udon/OrangeFox*.zip
            ~/fox/out/target/product/udon/recovery.img
            ~/fox/out/target/product/udon/boot.img
            ~/fox/out/target/product/udon/vendor_boot.img
          if-no-files-found: warn
